<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 590" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">How a write run decides the outcome for one image set</title>
  <desc id="d">For each image set the script first checks whether another set in the same run maps to the same manifest key; if so the outcome is collision, a failure. Otherwise it reads the existing manifest at that key. If there is none, it measures every object and writes the manifest: written. If one exists for a different layout or bucket, the outcome is exists-other-set, a failure, even with force. If one exists for the same set with the same keys, the outcome is exists, a skip, unless force is given, which rewrites it. If one exists for the same set but its keys differ, the outcome is exists-stale, a skip, unless force is given, which rewrites it. If an object cannot be read or measured the outcome is unreadable-object, and any other error is failed; both are failures.</desc>
  <style>
    .bg { fill: #ffffff; }
    .q { fill: #f4f4f5; stroke: #a1a1aa; stroke-width: 1.5; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .skip { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .h { font-size: 14px; font-weight: 600; fill: #18181b; }
    .p { font-size: 12.5px; fill: #3f3f46; }
    .e { stroke: #71717a; stroke-width: 1.5; fill: none; }
    .l { font-size: 12px; fill: #52525b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; }
      .q { fill: #27272a; stroke: #71717a; }
      .ok { fill: #052e2b; stroke: #34d399; }
      .skip { fill: #2e2206; stroke: #fbbf24; }
      .fail { fill: #2f0f0f; stroke: #f87171; }
      .h { fill: #f4f4f5; }
      .p { fill: #d4d4d8; }
      .e { stroke: #a1a1aa; }
      .l { fill: #a1a1aa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#71717a"/></marker>
  </defs>

  <rect class="bg" width="860" height="590"/>

  <rect class="q" x="24" y="24" width="300" height="58" rx="8"/>
  <text class="h" x="40" y="48">Does another set in this run map</text>
  <text class="h" x="40" y="68">to the same manifest key?</text>

  <rect class="fail" x="560" y="24" width="276" height="58" rx="8"/>
  <text class="h" x="576" y="48">collision</text>
  <text class="p" x="576" y="68">Failed. Neither set is written.</text>
  <path class="e" d="M324 53 H560" marker-end="url(#a)"/>
  <text class="l" x="430" y="45">yes</text>

  <path class="e" d="M174 82 V128" marker-end="url(#a)"/>
  <text class="l" x="184" y="110">no</text>

  <rect class="q" x="24" y="128" width="300" height="58" rx="8"/>
  <text class="h" x="40" y="152">Is there already a manifest</text>
  <text class="h" x="40" y="172">at that key?</text>

  <rect class="q" x="560" y="128" width="276" height="58" rx="8"/>
  <text class="h" x="576" y="152">Download and measure every</text>
  <text class="h" x="576" y="172">object in the set</text>
  <path class="e" d="M324 157 H560" marker-end="url(#a)"/>
  <text class="l" x="430" y="149">no</text>

  <rect class="ok" x="560" y="232" width="276" height="58" rx="8"/>
  <text class="h" x="576" y="256">written</text>
  <text class="p" x="576" y="276">Manifest stored under manifests/.</text>
  <path class="e" d="M698 186 V232" marker-end="url(#a)"/>
  <text class="l" x="708" y="214">all readable</text>

  <rect class="fail" x="560" y="336" width="276" height="76" rx="8"/>
  <text class="h" x="576" y="360">unreadable-object, failed</text>
  <text class="p" x="576" y="380">Failed. An object could not be read</text>
  <text class="p" x="576" y="398">or measured, or another error.</text>
  <path class="e" d="M836 157 H848 V374 H836" marker-end="url(#a)"/>
  <text class="l" x="760" y="326">on any error</text>

  <path class="e" d="M174 186 V232" marker-end="url(#a)"/>
  <text class="l" x="184" y="214">yes</text>

  <rect class="q" x="24" y="232" width="300" height="58" rx="8"/>
  <text class="h" x="40" y="256">Is it for the same layout</text>
  <text class="h" x="40" y="276">and the same bucket?</text>

  <rect class="fail" x="24" y="476" width="300" height="60" rx="8"/>
  <text class="h" x="40" y="500">exists-other-set</text>
  <text class="p" x="40" y="520">Failed. Never replaced, even with --force.</text>
  <path class="e" d="M60 290 V476" marker-end="url(#a)"/>
  <text class="l" x="70" y="388">no</text>

  <path class="e" d="M250 290 V336" marker-end="url(#a)"/>
  <text class="l" x="260" y="318">yes</text>

  <rect class="q" x="110" y="336" width="320" height="58" rx="8"/>
  <text class="h" x="126" y="360">Does it list exactly the keys</text>
  <text class="h" x="126" y="380">the set has now?</text>

  <rect class="skip" x="360" y="476" width="200" height="60" rx="8"/>
  <text class="h" x="376" y="500">exists</text>
  <text class="p" x="376" y="520">Skipped. Left alone.</text>
  <path class="e" d="M400 394 V476" marker-end="url(#a)"/>
  <text class="l" x="410" y="440">yes</text>

  <rect class="skip" x="584" y="476" width="252" height="60" rx="8"/>
  <text class="h" x="600" y="500">exists-stale</text>
  <text class="p" x="600" y="520">Skipped. Its sizes have changed.</text>
  <path class="e" d="M430 365 H500 V452 H700 V476" marker-end="url(#a)"/>
  <text class="l" x="508" y="444">no</text>

  <text class="l" x="24" y="570">With --force, a set that would be exists or exists-stale is rewritten instead and reported as written.</text>
</svg>

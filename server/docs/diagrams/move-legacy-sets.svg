<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Moving the legacy sets into the upload bucket</title>
  <desc id="d">The source bucket holds root-level flat files, which are skipped, and set folders such as photo_ab12/. For each set folder the script copies every object except manifest.json server-side to legacy/photo_ab12/ in the destination bucket, then reads manifest.json, moves its folder and keys under legacy/ and writes it last.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f4f5; stroke: #a1a1aa; stroke-width: 1.5; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .skip { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .h { font-size: 14px; font-weight: 600; fill: #18181b; }
    .p { font-size: 12.5px; fill: #3f3f46; }
    .e { stroke: #71717a; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; }
      .box { fill: #27272a; stroke: #71717a; }
      .ok { fill: #052e2b; stroke: #34d399; }
      .skip { fill: #2e2206; stroke: #fbbf24; }
      .h { fill: #f4f4f5; }
      .p { fill: #d4d4d8; }
      .e { stroke: #a1a1aa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#71717a"/></marker>
  </defs>
  <rect class="bg" width="760" height="250"/>
  <rect class="box" x="20" y="20" width="250" height="210" rx="8"/>
  <text class="h" x="36" y="46">Source bucket (the clone)</text>
  <rect class="skip" x="36" y="62" width="218" height="40" rx="6"/>
  <text class="p" x="48" y="87">flat-file.jpg  (root level: skipped)</text>
  <rect class="ok" x="36" y="118" width="218" height="96" rx="6"/>
  <text class="h" x="48" y="140">photo_ab12/</text>
  <text class="p" x="48" y="160">original.webp, full_..., large_...</text>
  <text class="p" x="48" y="180">manifest.json</text>
  <rect class="box" x="490" y="20" width="250" height="210" rx="8"/>
  <text class="h" x="506" y="46">Destination bucket (upload bucket)</text>
  <rect class="ok" x="506" y="118" width="218" height="96" rx="6"/>
  <text class="h" x="518" y="140">legacy/photo_ab12/</text>
  <text class="p" x="518" y="160">same objects, copied inside S3</text>
  <text class="p" x="518" y="180">manifest.json (rewritten, last)</text>
  <path class="e" d="M254 150 H506" marker-end="url(#a)"/>
  <text class="p" x="290" y="140">1. CopyObject</text>
  <path class="e" d="M254 190 H506" marker-end="url(#a)"/>
  <text class="p" x="282" y="182">2. move folder + keys</text>
</svg>

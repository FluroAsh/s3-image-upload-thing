<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">How a bucket write reaches a deploy hook</title>
  <desc id="d">A successful write to a bucket through the server restarts that bucket's two-minute countdown, held in memory. When two minutes pass with no further write, or when Deploy now is pressed, the server reads the bucket's hooks from the settings file on the data volume and sends each one an empty POST. The status each hook answers with is kept in memory as its last result. The settings file is the only place the full hook URLs are stored.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f4f5; stroke: #a1a1aa; stroke-width: 1.5; }
    .mem { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .disk { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .h { font-size: 15px; font-weight: 600; fill: #18181b; }
    .p { font-size: 13px; fill: #3f3f46; }
    .l { font-size: 12px; fill: #52525b; }
    .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; }
      .box { fill: #27272a; stroke: #71717a; }
      .mem { fill: #1e1b4b; stroke: #818cf8; }
      .disk { fill: #052e2b; stroke: #34d399; }
      .h { fill: #f4f4f5; }
      .p { fill: #d4d4d8; }
      .l { fill: #a1a1aa; }
      .line { stroke: #a1a1aa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#71717a"/></marker>
  </defs>
  <rect class="bg" width="920" height="220"/>

  <rect class="box" x="24" y="30" width="190" height="80" rx="8"/>
  <text class="h" x="40" y="58">Write route</text>
  <text class="p" x="40" y="80">upload, sizes, original,</text>
  <text class="p" x="40" y="97">collections (2xx only)</text>

  <rect class="mem" x="290" y="30" width="190" height="80" rx="8"/>
  <text class="h" x="306" y="58">Countdown</text>
  <text class="p" x="306" y="80">per bucket, in memory</text>
  <text class="p" x="306" y="97">restarts on each write</text>

  <rect class="box" x="556" y="30" width="170" height="80" rx="8"/>
  <text class="h" x="572" y="58">Fire hooks</text>
  <text class="p" x="572" y="80">empty POST to each,</text>
  <text class="p" x="572" y="97">10 s timeout</text>

  <rect class="box" x="780" y="30" width="120" height="80" rx="8"/>
  <text class="h" x="796" y="58">Sites</text>
  <text class="p" x="796" y="80">rebuild</text>

  <rect class="disk" x="556" y="140" width="170" height="64" rx="8"/>
  <text class="h" x="572" y="165">settings.json</text>
  <text class="p" x="572" y="185">on the /data volume</text>

  <line class="line" x1="214" y1="70" x2="288" y2="70" marker-end="url(#a)"/>
  <text class="l" x="222" y="62">marks</text>
  <line class="line" x1="480" y1="70" x2="554" y2="70" marker-end="url(#a)"/>
  <text class="l" x="486" y="62">2 min</text>
  <line class="line" x1="726" y1="70" x2="778" y2="70" marker-end="url(#a)"/>
  <line class="line" x1="641" y1="140" x2="641" y2="112" marker-end="url(#a)"/>
  <text class="l" x="650" y="130">reads URLs</text>
  <text class="l" x="290" y="140">Deploy now skips the wait</text>
</svg>

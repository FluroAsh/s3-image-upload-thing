name: s3-image-upload-thing

services:
  s3-upload-client:
    container_name: s3-upload-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - s3-upload-server
    environment:
      NEXT_PUBLIC_API_URL: http://s3-upload-server:5101
      API_URL: http://s3-upload-server:5101
    ports:
      - "5100:5100"

  s3-upload-server:
    container_name: s3-upload-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5101:5101"

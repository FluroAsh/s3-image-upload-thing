name: Deployment

concurrency: production

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
  workflow_dispatch: # for manual deployment

env:
  DOCKER_COMPOSE_FILE: ./docker-compose.yml
  DEPLOY_PATH: /docker/s3-image-upload-thing

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git pull origin main
            else
              echo "Cloning repository..."
              git clone git@github.com:FluroAsh/s3-image-upload-thing.git .
            fi

            mkdir -p server
            echo "ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" > server/.env
            echo "SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> server/.env

            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down || true
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build --no-cache
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d
            sleep 10
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs --tail=50

      - name: Health check
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -f http://localhost:5100 > /dev/null 2>&1 && echo "✅ Client is healthy" || echo "❌ Client health check failed"
            curl -f http://localhost:5101/health > /dev/null 2>&1 && echo "✅ Server is healthy" || echo "❌ Server health check failed"

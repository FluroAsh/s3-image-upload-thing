name: Deployment

concurrency: production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

env:
  DOCKER_COMPOSE_FILE: .docker/docker-compose.yml
  DEPLOY_PATH: /docker/s3-upload-thing

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            echo "SSH connection successful!"
            whoami
            pwd

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Create deployment directory if it doesn't exist
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # Clone or update repository (uses server's configured git credentials)
            if [ -d ".git" ]; then
              echo "Repository exists, pulling latest changes..."
              git pull origin main
            else
              echo "Cloning repository..."
              git clone git@github.com:FluroAsh/s3-image-upload-thing.git
            fi

            # Create .env file for server
            mkdir -p server
            cat > server/.env.docker << EOF
            ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            EOF

            # Stop existing services
            docker-compose -f ${{ env.DOCKER_COMPOSE_FILE }} down || true

            # Build images
            docker-compose -f ${{ env.DOCKER_COMPOSE_FILE }} build --no-cache

            # Start services
            docker-compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d

            # Wait for services to be ready
            sleep 10

            # Verify services are running
            docker-compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps

            # Show logs
            docker-compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs --tail=50

      # - name: Health check
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
